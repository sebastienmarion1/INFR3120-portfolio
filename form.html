<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
    <div id="wrapper">
        <h1>Feedback Form</h1>
        <form 
        action="mailto:ahmed.sheikh@ontariotechu.net"
        method="post"
        enctype="text/plain"
        name="form">
        <p>
            <label for="Fname">First Name :</label>
            <input type="text" name="Fname" size="32"
            placeholder="Enter your first name" 
            required>
        </p>
        <p>
            <label for="Lname">Last Name :</label>
            <input type="text" name="Lname" size="32"
            placeholder="Enter your last name" 
            required>
        </p>
        <p>
            <label for="email">Email :</label>
            <input type="email" name="email" size="32" 
            placeholder="Enter your email address" required>
        </p>
        <p>
            <label for="Comments">Comments</label>
            <br>
            <textarea name="Comments" cols="60" rows="6"></textarea>
        </p>
        <p>
            <input type="checkbox" name="maillist">
            <label for="maillist">Put me on your e-list</label>
        </p>
        <p>
            <label for="where">Where did you find us?</label>
            <select name="where">
                <option value="search engine">Search Engine</option>
                <option value="social network">Social Network</option>
                <option value="craigslist">Craigslist</option>
                <option value="other">Other</option>
            </select>
        </p>
        <p>
            <label for="counteries">Where do you live</label>
            <input list="counteries">
            <datalist id="counteries">
                <option value="Afghanistan">
                <option value="Albania">
                <option value="Algeria">
                <option value="Andorra">
                <option value="Angola">
                <option value="Antigua and Barbuda">
                <option value="Argentina">
                <option value="Armenia">
                <option value="Aruba">
                <option value="Australia">
                <option value="Austria">
                <option value="Azerbaijan">
            </datalist>
        </p>
        <p>
            <label for="date">Whats your brithday?</label>
            <input type="date" name="date">
        </p>
        <p>
            <label for="color">Whats your fav color?</label>
            <input type="color" name="color">
        </p>
        <label>Do you like this feedback form</label>
        <label><input type="radio" name="answer" value="yes">Yes</label>
        <label><input type="radio" name="answer" value="no">No</label>
        <br><br>
        <input type="submit" value="Click here to submit the form">
        <input type="reset" value="Click here to reset the form">
        </form>
        

        <p><label for="oninput">How often do you visit this site monthly?</label></p>
    <form oninput="x.value=parseInt(a.value)*parseInt(b.value)">
    <p><input type="number" id="a" placeholder="Visits/day"> * <input type="number" id="b" placeholder="Days you visit">
        = <output name="x" for="a b"></output>
    </form></p>
    </div>
</body>
</html>
